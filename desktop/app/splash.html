<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'">
<title>LeadLift</title>
<style>
  html, body { margin: 0; height: 100%; font-family: "Segoe UI", system-ui, sans-serif; color: #fff; -webkit-user-select: none; user-select: none; -webkit-app-region: drag; }
  body { display: grid; place-items: center; background: radial-gradient(28rem 18rem at 100% 0%, rgb(99 102 241 / .55), transparent 60%), radial-gradient(24rem 16rem at 0% 100%, rgb(139 92 246 / .45), transparent 60%), #0b1130; overflow: hidden; }
  .box { text-align: center; }
  img { width: 76px; height: 76px; border-radius: 20px; box-shadow: 0 12px 40px rgb(79 70 229 / .55); animation: pop .7s cubic-bezier(.34,1.56,.64,1) both; }
  h1 { margin: 18px 0 4px; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  p { margin: 0; font-size: 12.5px; color: rgb(255 255 255 / .6); }
  .bar { margin: 22px auto 0; width: 180px; height: 4px; border-radius: 99px; background: rgb(255 255 255 / .12); overflow: hidden; }
  .bar i { display: block; width: 40%; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #a5b4fc, #c4b5fd); animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
  @keyframes pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
  <div class="box">
    <img src="icon.png" alt="">
    <h1>LeadLift</h1>
    <p>Starting… this takes a few seconds</p>
    <div class="bar"><i></i></div>
  </div>
</body>
</html>
