appId: com.seoacquisitionos.desktop
productName: LeadLift
copyright: Copyright © 2026 Saqlain Nazir
directories:
  app: app
  output: dist
  buildResources: assets
asar: true
afterPack: after-pack.cjs
# The self-contained server, its Node runtime and the database migrations sit next to the app.
extraResources:
  # Dot-folders such as .next are listed explicitly; node_modules is added by after-pack.cjs.
  - from: build/server
    to: server
    filter: ["**/*", "**/.*", "**/.*/**"]
  - from: build/node
    to: node
  - from: build/migrations
    to: migrations
win:
  target: nsis
  icon: assets/icon.png
  executableName: LeadLift
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: LeadLift
  # Keep the user's data (database, PDFs, settings) when the app is uninstalled or updated.
  deleteAppDataOnUninstall: false
artifactName: LeadLift-Setup-${version}.${ext}
# Installed apps look for new versions in this repository's GitHub releases (latest.yml + installer).
# Building never uploads anything; a release is published by hand.
publish:
  provider: github
  owner: Saqlain78865
  repo: seo-client-acquisition-os
  releaseType: release
